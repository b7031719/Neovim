# $light = rgba(66, 60, 52, 0.9)
$light = rgba(168, 153, 132, 1.0)
$dark = rgba(39, 40, 34, 0.8)
$alt = rgb(143, 143, 143)

animations {
  bezier=linear, 1, 1, 0, 0
  animation=fadeIn, 1, 5, linear
  animation=fadeOut, 1, 5, linear
  animation=inputFieldDots, 1, 2, linear
  enabled=true
}

background {
  monitor=
  path = screenshot
  blur_size=3
  blur_passes=3
  color= $dark
}

general {
  hide_cursor=true
}

input-field {
  monitor=
  size=20%, 5%
  check_color=rgba(e6db74ee) rgba(fd971fee) 45deg
  dots_spacing=0.300000
  fade_on_empty=false
  fail_color=rgba(f92672ee) rgba(f94226ee) 40deg
  font_color= $alt
  font_family= Caskaydia Cove Nerd Font
  inner_color= $dark
  outer_color= $light
  outline_thickness=3
  placeholder_text=Input Password...
  position=0,0
  rounding=15
  halign=center
  valign=center
}

label {
  monitor=
  font_family=Caskaydia Cove Nerd Font
  color= $alt
  font_size=15
  position=0, -450
  text=cmd[update:60000] date +"%A, %d %B %Y"
  halign=center
  valign=top
}

label {
  monitor=
  font_family=Caskaydia Cove Nerd Font
  color= $alt
  font_size=100
  position=0, -300
  text=cmd[update:60000] date +"%H:%M"
  halign=center
  valign=top
}
